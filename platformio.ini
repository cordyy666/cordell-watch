; Cordell Watch — Freenove FNK0104B (ESP32-S3 N16, ILI9341 + FT6336U + ES8311 audio)
[env:cordellwatch]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.partitions = default_16MB.csv
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 6553600
build_unflags = -Werror=all
lib_ldf_mode = deep+
lib_deps =
    symlink:///home/kali/.platformio/packages/framework-arduinoespressif32/libraries/Network
build_flags =
    -I ${platformio.packages_dir}/framework-arduinoespressif32/libraries/Network/src
    -I ${platformio.packages_dir}/framework-arduinoespressif32/libraries/NetworkClientSecure/src
    -I lib
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D LV_CONF_INCLUDE_SIMPLE
    -D CORE_DEBUG_LEVEL=0
